name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,sentry,backup]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest

  api-postgres:
    name: api on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/orbit_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,sentry,backup]"
      - name: Tests
        run: pytest

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: browser test (Playwright)
    runs-on: ubuntu-latest
    needs:
      - api
      - web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the api
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Install the web app and a browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the api with the test harness
        working-directory: api
        env:
          ORBIT_BASE_URL: http://127.0.0.1:3100
          ORBIT_DEMO_MODE: "true"
          DATABASE_URL: sqlite:///./e2e.db
        run: |
          ORBIT_SECRET_KEY="$(openssl rand -hex 32)"
          export ORBIT_SECRET_KEY
          nohup uvicorn tests.e2e_server:build_e2e_app --factory --host 127.0.0.1 --port 8100 > ../api-e2e.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8100/api/health; then exit 0; fi
            sleep 1
          done
          cat ../api-e2e.log
          exit 1
      - name: Run the browser test
        working-directory: web
        run: npm run test:e2e
      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            web/playwright-report
            web/test-results
            api-e2e.log
          if-no-files-found: ignore

  compose:
    name: docker compose from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env the way the README says
        run: |
          cp .env.example .env
          secret="$(openssl rand -base64 48 | tr -d '\n=+/')"
          sed -i "s|^ORBIT_SECRET_KEY=.*|ORBIT_SECRET_KEY=${secret}|" .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check the front door
        run: |
          curl --fail --silent --show-error http://localhost/api/health
          curl --fail --silent --show-error http://localhost/.well-known/oauth-protected-resource/mcp
          curl --fail --silent --show-error http://localhost/.well-known/oauth-authorization-server
          curl --fail --silent --show-error --output /dev/null http://localhost/auth/sign-in
          curl --fail --silent --show-error --output /dev/null http://localhost/
      - name: Show logs when something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
