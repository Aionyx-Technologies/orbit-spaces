name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            email="$(git log -1 --format=%ae "$sha")"
            case "$email" in
              *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit ${sha} (${email}) has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the line with: git commit --amend -s (last commit) or git rebase --signoff origin/main (all commits)."
            echo "See the Developer Certificate of Origin section of CONTRIBUTING.md."
            exit 1
          fi
