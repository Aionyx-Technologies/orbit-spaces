<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f9fafd;color:#141726;font:16px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
<tr><td style="padding:0 0 16px 4px;">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td style="padding:0 10px 0 0;vertical-align:middle;"><img src="{{ logo_url }}" width="28" height="28" alt="" style="display:block;width:28px;height:28px;border:0;border-radius:7px;"></td>
<td style="vertical-align:middle;font-size:18px;font-weight:650;letter-spacing:-0.01em;">Orbit</td>
</tr></table>
</td></tr>
<tr><td style="background:#ffffff;border:1px solid #e1e2ea;border-radius:16px;padding:28px 24px;">
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 4px 0 4px;font-size:13px;color:#52576c;">{% block footer %}Sent by Orbit.{% endblock %}</td></tr>
</table>
</body>
</html>
