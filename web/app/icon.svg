<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Orbit</title>
  <style>.ring{fill:none;stroke:#524ce3}.core{fill:#524ce3}.sat{fill:#faab3f}@media (prefers-color-scheme:dark){.ring{stroke:#a0a6ff}.core{fill:#a0a6ff}.sat{fill:#fcb442}}.orbit{transform-box:view-box;transform-origin:16px 16px;animation:orbit 8s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.orbit{animation:none}}</style>
  <circle class="ring" cx="16" cy="16" r="10.4" stroke-width="3.8"/>
  <circle class="core" cx="16" cy="16" r="4.6"/>
  <g class="orbit"><circle class="sat" cx="24.62" cy="10.18" r="4.3"/></g>
</svg>
